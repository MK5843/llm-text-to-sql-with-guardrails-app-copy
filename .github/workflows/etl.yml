name: Daily Text to SQL ETL

on:
  schedule:
    - cron: "0 3 * * *"   # runs every day at 3:00 AM UTC
  workflow_dispatch:       # lets you also trigger it manually from GitHub's UI

jobs:
  run-etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"

      # ---- NEW (active) ----
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install sqlalchemy "psycopg[binary]" python-dotenv

      - name: Check driver
        run: python -c "import psycopg; print('psycopg OK', psycopg.__version__)"

      - name: Run ETL
        env:
          DATABASE_URL: ${{ secrets['DATABASE_URL'] }} # or use ${{ secrets.DATABASE_URL }} if you prefer
        run: python etl_daily_stats.py