<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI-Generated Text-to-PostgreSQL with Guardrails</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="login-card">
    <h2 id="form-title">Sign In</h2>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <p class="error-msg" style="display:block;">{{ messages[0] }}</p>
      {% endif %}
    {% endwith %}

    <form id="auth-form" method="post" action="{{ url_for('login') }}">
      <input type="email" name="email" placeholder="Email" required>
      <div class="password-field">
        <input type="password" name="password" placeholder="Password" required>
      </div>
      <button type="submit" class="submit-btn">Sign In</button>
    </form>

    <p class="toggle-text">
      <span id="toggle-prompt">Don't have an account?</span>
      <a href="#" id="toggle-link" class="google-link">Sign up</a>
    </p>

    <hr class="login-divider">

    <a href="{{ url_for('google_login') }}" class="google-btn">Sign in with Google</a>

    <p class="version-text">AI-Generated Text-to-PostgreSQL with Guardrails</p>
  </div>

  <script>
    const form = document.getElementById("auth-form");
    const title = document.getElementById("form-title");
    const submitBtn = form.querySelector(".submit-btn");
    const togglePrompt = document.getElementById("toggle-prompt");
    const toggleLink = document.getElementById("toggle-link");

    function applyMode(mode) {
      if (mode === "register") {
        title.textContent = "Create Account";
        submitBtn.textContent = "Sign Up";
        form.action = "{{ url_for('register') }}";
        togglePrompt.textContent = "Already have an account?";
        toggleLink.textContent = "Sign in";
        form.dataset.mode = "register";
      } else {
        title.textContent = "Sign In";
        submitBtn.textContent = "Sign In";
        form.action = "{{ url_for('login') }}";
        togglePrompt.textContent = "Don't have an account?";
        toggleLink.textContent = "Sign up";
        form.dataset.mode = "login";
      }
    }

    toggleLink.addEventListener("click", (e) => {
      e.preventDefault();
      applyMode(form.dataset.mode === "login" ? "register" : "login");
    });

    applyMode("{{ mode|default('login') }}");
  </script>
</body>
</html>
